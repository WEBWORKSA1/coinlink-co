name: Auto-refresh data & rebuild site

on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours (UTC)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "_src/**"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch market, news, video & network data
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Rebuild phishing blocklist (weekly)
        run: python scripts/build_blocklist.py --max-age-days 6

      - name: Build site
        run: python scripts/build.py

      - name: Commit & push if changed
        run: |
          git config user.name "coinlink-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Auto-refresh data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
